name: review-seal
description: Review changed files with an independent Claude reviewer, record the seals, and fail if any covered file still lacks a fresh review.
author: oo-pibe
branding:
  icon: check-square
  color: green
inputs:
  anthropic-api-key:
    description: Anthropic API key for the reviewer. Pass it from a repository secret.
    required: true
  base:
    description: Branch to compare against. Changed files are found from the merge base with origin/<base>, so check out with actions/checkout and fetch-depth 0.
    required: false
    default: ${{ github.base_ref }}
  commit:
    description: >-
      "true" commits the updated ledger back to the pull request branch (check out that branch with actions/checkout ref, since a detached HEAD cannot be pushed).
      "false" prints this run's reviews, then puts the ledger back as committed, so the check judges what is actually on the branch.
    required: false
    default: "true"
  claude-code-version:
    description: Version of @anthropic-ai/claude-code to install.
    required: false
    default: "2.1.251"
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BASE: ${{ inputs.base }}
      run: |
        if [ -z "${BASE}" ]; then echo "::error::review-seal: no base branch (this action runs on pull_request events)"; exit 1; fi
        if [ -z "${ANTHROPIC_API_KEY}" ]; then echo "::error::review-seal: anthropic-api-key is empty (fork pull request or missing secret)"; exit 1; fi
        if ! git rev-parse --verify --quiet "origin/${BASE}" >/dev/null; then echo "::error::review-seal: origin/${BASE} not found; use actions/checkout with fetch-depth: 0"; exit 1; fi
    - name: Install Claude Code
      shell: bash
      env:
        CC_VERSION: ${{ inputs.claude-code-version }}
      run: npm install -g "@anthropic-ai/claude-code@${CC_VERSION}"
    - name: Review changed files
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BASE: ${{ inputs.base }}
      run: node "$GITHUB_ACTION_PATH/bin/review-seal.js" review --changed-since "origin/${BASE}" 2>&1 | tee "$RUNNER_TEMP/review-seal-review.log" || true
    - name: Commit the ledger
      if: inputs.commit == 'true'
      shell: bash
      run: |
        LEDGER="$(node "$GITHUB_ACTION_PATH/bin/review-seal.js" ledger-path)"
        if [ -n "$(git status --porcelain -- "$LEDGER")" ]; then
          git symbolic-ref -q HEAD >/dev/null || { echo "::error::review-seal: check out the PR branch (actions/checkout with ref: the PR head branch) or set commit: false"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$LEDGER"
          git commit -m "review-seal: record independent reviews"
          git push
        fi
    - name: Restore the ledger
      if: inputs.commit != 'true'
      shell: bash
      run: |
        LEDGER="$(node "$GITHUB_ACTION_PATH/bin/review-seal.js" ledger-path)"
        echo "review-seal: commit is false, so this run's reviews are not kept. They were:"
        cat "$RUNNER_TEMP/review-seal-review.log" 2>/dev/null || true
        git checkout -- "$LEDGER" 2>/dev/null || rm -f -- "$LEDGER"
    - name: Check
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: node "$GITHUB_ACTION_PATH/bin/review-seal.js" check --changed-since "origin/${BASE}"
