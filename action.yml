name: review-seal
description: Review changed files with an independent Claude reviewer, record the seals, and fail if any covered file still lacks a fresh review.
author: oo-pibe
branding:
  icon: check-square
  color: green
inputs:
  anthropic-api-key:
    description: Anthropic API key for the reviewer. Pass it from a repository secret.
    required: true
  base:
    description: Branch to compare against. Changed files are found from the merge base with origin/<base>, so check out with actions/checkout and fetch-depth 0.
    required: false
    default: ${{ github.base_ref }}
  commit:
    description: >-
      "true" commits the updated ledger back to the pull request branch (check out that branch with actions/checkout ref, since a detached HEAD cannot be pushed).
      "false" prints this run's reviews, then puts the ledger back as committed, so the check judges what is actually on the branch.
    required: false
    default: "true"
  mode:
    description: >-
      "pr" (default) reviews a pull request's changed files.
      "due" re-reviews every covered file that is stale or past its shelf life, for a scheduled workflow, and opens or updates a pull request with the results
      from the branch review-seal/scheduled. Due mode needs "permissions: contents: write, pull-requests: write" in the workflow and the repository setting
      "Allow GitHub Actions to create and approve pull requests" (Settings, Actions, General) when it uses the default token.
    required: false
    default: pr
  github-token:
    description: >-
      Token used to open the pull request in "due" mode. A pull request opened with the default token does not start other workflows;
      pass a personal access token if checks should run on it.
    required: false
    default: ${{ github.token }}
  claude-code-version:
    description: Version of @anthropic-ai/claude-code to install.
    required: false
    default: "2.1.251"
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BASE: ${{ inputs.base }}
        MODE: ${{ inputs.mode }}
      run: |
        if [ "${MODE}" != "pr" ] && [ "${MODE}" != "due" ]; then echo "::error::review-seal: mode must be \"pr\" or \"due\""; exit 1; fi
        if [ -z "${ANTHROPIC_API_KEY}" ]; then echo "::error::review-seal: anthropic-api-key is empty (fork pull request or missing secret)"; exit 1; fi
        if [ "${MODE}" = "due" ]; then exit 0; fi
        if [ -z "${BASE}" ]; then echo "::error::review-seal: no base branch (this action runs on pull_request events)"; exit 1; fi
        if ! git rev-parse --verify --quiet "origin/${BASE}" >/dev/null; then echo "::error::review-seal: origin/${BASE} not found; use actions/checkout with fetch-depth: 0"; exit 1; fi
    - name: Install Claude Code
      shell: bash
      env:
        CC_VERSION: ${{ inputs.claude-code-version }}
      run: npm install -g "@anthropic-ai/claude-code@${CC_VERSION}"
    - name: Review changed files
      if: inputs.mode == 'pr'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        BASE: ${{ inputs.base }}
      run: |
        cd "$(git rev-parse --show-toplevel)"
        # The reviewer can read files in the repository, so checkout's token is taken out of .git/config while it runs.
        # git config --local does not follow includeIf; credential files included that way live outside the working directory.
        AUTH="$(git config --local --get-all http.https://github.com/.extraheader || true)"
        restore_auth() {
          if [ -n "$AUTH" ]; then
            git config --local --unset-all http.https://github.com/.extraheader || true
            printf '%s\n' "$AUTH" | while IFS= read -r h; do git config --local --add http.https://github.com/.extraheader "$h"; done
          fi
        }
        trap restore_auth EXIT
        git config --local --unset-all http.https://github.com/.extraheader || true
        node "$GITHUB_ACTION_PATH/bin/review-seal.js" review --changed-since "origin/${BASE}" 2>&1 | tee "$RUNNER_TEMP/review-seal-review.log" || true
    - name: Commit the ledger
      if: inputs.mode == 'pr' && inputs.commit == 'true'
      shell: bash
      run: |
        cd "$(git rev-parse --show-toplevel)"
        LEDGER="$(node "$GITHUB_ACTION_PATH/bin/review-seal.js" ledger-path)"
        if [ -n "$(git status --porcelain -- "$LEDGER")" ]; then
          git symbolic-ref -q HEAD >/dev/null || { echo "::error::review-seal: check out the PR branch (actions/checkout with ref: the PR head branch) or set commit: false"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$LEDGER"
          git commit -m "review-seal: record independent reviews"
          git push
        fi
    - name: Restore the ledger
      if: inputs.mode == 'pr' && inputs.commit != 'true'
      shell: bash
      run: |
        cd "$(git rev-parse --show-toplevel)"
        LEDGER="$(node "$GITHUB_ACTION_PATH/bin/review-seal.js" ledger-path)"
        echo "review-seal: commit is false, so this run's reviews are not kept. They were:"
        cat "$RUNNER_TEMP/review-seal-review.log" 2>/dev/null || true
        git checkout -- "$LEDGER" 2>/dev/null || rm -f -- "$LEDGER"
    - name: Check
      if: inputs.mode == 'pr'
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        cd "$(git rev-parse --show-toplevel)"
        node "$GITHUB_ACTION_PATH/bin/review-seal.js" check --changed-since "origin/${BASE}"
    - name: Re-review what is due
      if: inputs.mode == 'due'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        cd "$(git rev-parse --show-toplevel)"
        LEDGER="$(node "$GITHUB_ACTION_PATH/bin/review-seal.js" ledger-path)"
        BOT="41898282+github-actions[bot]@users.noreply.github.com"
        rm -f "$RUNNER_TEMP/review-seal-due.skip" "$RUNNER_TEMP/review-seal-due.status"
        : > "$RUNNER_TEMP/review-seal-due.log"
        LEASE=""
        if git fetch -q --depth 1 origin refs/heads/review-seal/scheduled 2>/dev/null; then
          LEASE="$(git rev-parse FETCH_HEAD)"
          # Only the tip is checked, since a shallow checkout has no history to compare with. This action only ever
          # pushes one plain commit by the bot, so any other tip (a person's commit, a merge) was put there by hand.
          PARENTS="$(git cat-file -p "$LEASE" | grep -c '^parent ' || true)"
          if [ "$(git log -1 --format=%ae "$LEASE")" != "$BOT" ] || [ "$PARENTS" -gt 1 ]; then
            echo "::warning::review-seal: review-seal/scheduled has commits from people; not overwriting. Merge or close the pull request and delete the branch to resume."
            touch "$RUNNER_TEMP/review-seal-due.skip"
            exit 0
          fi
          # Reviews the scheduled branch already renewed are reused, so they are not paid for twice. Each entry is
          # taken only if it still fits the current file and checklist and is newer, so nothing on main is rolled back.
          if git show "${LEASE}:${LEDGER}" > "$RUNNER_TEMP/scheduled-ledger.json" 2>/dev/null; then
            node "$GITHUB_ACTION_PATH/bin/review-seal.js" merge-ledger "$RUNNER_TEMP/scheduled-ledger.json" \
              || echo "::warning::review-seal: could not reuse the reviews on review-seal/scheduled; reviewing again"
          fi
        fi
        printf '%s' "$LEASE" > "$RUNNER_TEMP/review-seal-due.lease"
        # The reviewer can read files in the repository, so checkout's token is taken out of .git/config while it runs.
        # git config --local does not follow includeIf; credential files included that way live outside the working directory.
        AUTH="$(git config --local --get-all http.https://github.com/.extraheader || true)"
        restore_auth() {
          if [ -n "$AUTH" ]; then
            git config --local --unset-all http.https://github.com/.extraheader || true
            printf '%s\n' "$AUTH" | while IFS= read -r h; do git config --local --add http.https://github.com/.extraheader "$h"; done
          fi
        }
        trap restore_auth EXIT
        git config --local --unset-all http.https://github.com/.extraheader || true
        STATUS=0
        node "$GITHUB_ACTION_PATH/bin/review-seal.js" review --due 2>&1 | tee "$RUNNER_TEMP/review-seal-due.log" || STATUS=$?
        echo "$STATUS" > "$RUNNER_TEMP/review-seal-due.status"
    - name: Open or update the pull request
      if: inputs.mode == 'due'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cd "$(git rev-parse --show-toplevel)"
        if [ -f "$RUNNER_TEMP/review-seal-due.skip" ]; then exit 0; fi
        STATUS="$(cat "$RUNNER_TEMP/review-seal-due.status" 2>/dev/null || echo 1)"
        LEASE="$(cat "$RUNNER_TEMP/review-seal-due.lease" 2>/dev/null || true)"
        LEDGER="$(node "$GITHUB_ACTION_PATH/bin/review-seal.js" ledger-path)"
        START="$(git symbolic-ref -q --short HEAD || true)"
        BODY="$RUNNER_TEMP/review-seal-pr.md"
        node --input-type=module -e '
          import fs from "node:fs";
          import { pathToFileURL } from "node:url";
          const { sanitizeText } = await import(pathToFileURL(process.env.GITHUB_ACTION_PATH + "/lib/text.js"));
          let log = "";
          try { log = fs.readFileSync(process.argv[1], "utf8"); } catch {}
          // Each line of the log is shown as text, never as terminal control sequences.
          log = log.split(/\r?\n/).map(sanitizeText).join("\n");
          const max = 60000;
          const cut = log.length > max;
          if (cut) log = log.slice(0, max);
          const longest = Math.max(0, ...(log.match(/~+/g) || []).map((r) => r.length));
          const fence = "~".repeat(Math.max(3, longest + 1));
          const end = log.endsWith("\n") || !log ? "" : "\n";
          process.stdout.write("Scheduled re-review of files that were stale or past their shelf life.\n\n" + fence + "\n" + log + end + fence + "\n" + (cut ? "\nlog truncated; see the workflow run\n" : ""));
        ' "$RUNNER_TEMP/review-seal-due.log" > "$BODY"
        # A pull request someone closed without merging means "stop": nothing is committed or pushed until the branch is
        # deleted. A merged one is done with, so a new pull request starts.
        STATE=""
        if [ -n "$(git status --porcelain -- "$LEDGER")" ]; then STATE="$(gh pr view review-seal/scheduled --json state -q .state 2>/dev/null || true)"; fi
        if [ "$STATE" = "CLOSED" ]; then
          echo "::warning::review-seal: the scheduled pull request was closed; delete the review-seal/scheduled branch to resume"
          if [ "$STATUS" != "0" ]; then echo "::error::review-seal: some reviews failed; see the log"; exit 1; fi
          exit 0
        fi
        # Makes sure review-seal/scheduled has an open pull request. "edit" also refreshes the body of an open one.
        ensure_pr() {
          case "$STATE" in
            OPEN) if [ "$1" = "edit" ]; then gh pr edit review-seal/scheduled --body-file "$BODY"; fi ;;
            *)
              if [ -n "$START" ]; then
                gh pr create --head review-seal/scheduled --base "$START" --title "review-seal: scheduled re-review" --body-file "$BODY"
              else
                gh pr create --head review-seal/scheduled --title "review-seal: scheduled re-review" --body-file "$BODY"
              fi ;;
          esac
        }
        if [ -n "$(git status --porcelain -- "$LEDGER")" ] && [ -n "$LEASE" ] && git show "${LEASE}:${LEDGER}" 2>/dev/null | cmp -s - "$LEDGER"; then
          echo "review-seal: review-seal/scheduled already has these reviews."
          # A previous run may have pushed the branch but failed to open its pull request.
          { printf 'The reviews on this branch were recorded by an earlier scheduled run; the log below is from the latest one.\n\n'; cat "$BODY"; } > "$BODY.tmp"
          mv "$BODY.tmp" "$BODY"
          ensure_pr keep
        elif [ -n "$(git status --porcelain -- "$LEDGER")" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B review-seal/scheduled
          git add -- "$LEDGER"
          git commit -m "review-seal: scheduled re-review"
          # Refused if the branch moved since the review step looked at it.
          git push --force-with-lease="refs/heads/review-seal/scheduled:${LEASE}" origin HEAD:refs/heads/review-seal/scheduled
          ensure_pr edit
        elif [ "$STATUS" = "0" ]; then
          echo "review-seal: nothing was due."
        fi
        if [ "$STATUS" != "0" ]; then echo "::error::review-seal: some reviews failed; see the log"; exit 1; fi
